/* Design: Moodboard «Lernplattform unsereklasse» – Details in docs/DESIGN.md */
:root{
  --tinte:#0F1B33; --blau:#0154BE; --blau-dunkel:#013E8C; --papier:#F3F5FA; --sonne:#FFC83D;
  --grau-text:#4A5670; --grau-2:#3A465F; --linie:#DCE2EE; --flaeche:#EEF1F7; --weiss:#FFFFFF;
  --petrol:#0A6E7D; --petrol-hell:#E0F3F5; --petrol-dunkel:#07505B;
  --radius-karte:22px; --radius-knopf:12px;
  --titel:'Bricolage Grotesque',system-ui,sans-serif; --text:'Atkinson Hyperlegible',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papier);color:var(--tinte);font-family:var(--text);font-size:17px;line-height:1.5}
a{color:var(--blau)} a:hover{color:var(--blau-dunkel)}
h1,h2,h3{font-family:var(--titel);margin:0;letter-spacing:-.01em}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.kopf{background:var(--weiss);border-bottom:1px solid var(--linie)}
.kopf .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.logo{font-family:var(--titel);font-weight:800;font-size:24px;color:var(--blau);text-decoration:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--flaeche);color:var(--grau-2)}
.pill.sonne{background:var(--sonne);color:var(--tinte)}
.pill.dunkel{background:var(--tinte);color:#fff}
main{padding:36px 0 64px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.karte{background:var(--weiss);border-radius:var(--radius-karte);padding:22px;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:var(--tinte)}
a.karte:hover{outline:3px solid var(--tinte)}
.knopf{min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:0 22px;border-radius:var(--radius-knopf);background:var(--blau);color:#fff;font-weight:700;text-decoration:none;border:0;font:700 17px var(--text);cursor:pointer}
.knopf:hover{background:var(--blau-dunkel);color:#fff}
.knopf.hell{background:#fff;color:var(--tinte);border:2px solid var(--tinte)}
.icon{width:44px;height:44px;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--titel);font-weight:800;font-size:18px;flex:none}
.hero{color:#fff}
.hero .wrap{padding-top:28px;padding-bottom:36px;display:flex;flex-direction:column;gap:12px}
.hero a{color:#fff}
.hero h1{font-weight:800;font-size:clamp(42px,7vw,76px);line-height:.98}
.sub{color:var(--grau-text)}
.layout{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.layout>section{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:14px}
.layout>aside{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:20px}
details.ep{background:#fff;border-radius:18px;padding:0}
details.ep summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;gap:14px;align-items:center}
details.ep summary::-webkit-details-marker{display:none}
details.ep[open]>summary{border-bottom:1px solid var(--linie)}
.nr{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.items{padding:8px 20px 18px;display:flex;flex-direction:column;gap:12px}
.item{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px dashed var(--linie)}
.item:first-child{border-top:0}
.item .t{font-weight:700}
.item audio{width:100%;max-width:560px}
.code{font:700 18px/1 var(--text);letter-spacing:.08em;background:var(--flaeche);padding:6px 10px;border-radius:8px}
.ampel{display:flex;gap:6px}
.ampel button{flex:1;min-height:44px;border-radius:10px;border:2px solid #6B7892;background:#fff;color:var(--grau-2);font:700 14px var(--text);cursor:pointer}
.ampel button[aria-pressed=true].g{background:var(--petrol);color:#fff;border:3px solid var(--tinte)}
.ampel button[aria-pressed=true].y{background:var(--sonne);color:var(--tinte);border:3px solid var(--tinte)}
.ampel button[aria-pressed=true].r{background:#fff;color:var(--tinte);border:3px solid var(--tinte)}
.fuss{color:var(--grau-text);font-size:14px;padding:24px 0 40px}
input[type=password],input[type=text]{min-height:52px;width:100%;border:2px solid var(--tinte);border-radius:12px;padding:0 14px;font:400 18px var(--text)}
.entwurf{background:#FFF1DC;color:#8A4104}
main.wrap{padding-top:36px;padding-bottom:64px}
.karte .knopf{align-self:flex-start}
a.karte .knopf{align-self:stretch}
a.karte h2,a.karte h3{color:var(--tinte)}
details.mehr{border-top:1px solid var(--linie);padding-top:12px}
details.mehr summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}

.schnell{display:none;flex-direction:column;gap:10px}
.schnell .knopf{width:100%;font-size:18px}
.schnell-pr{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--tinte);color:#fff;border-radius:var(--radius-knopf);padding:12px 16px;min-height:48px;font-weight:700}
.schnell-pr b{color:#C9D3E8;white-space:nowrap}
@media (max-width:900px){.schnell{display:flex}.nur-breit{display:none!important}}

.fuss{padding:24px 20px 40px}
.kopf-text{font-size:14px;font-weight:700;color:var(--grau-2)}
details.ep summary .seite{flex:none;background:var(--sonne);color:var(--tinte);border-radius:10px;padding:3px 10px;font:800 17px var(--titel);white-space:nowrap}
details.ep summary .pfeil{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:20px;transition:transform .2s;color:var(--grau-2)}
details.ep[open]>summary .pfeil{transform:rotate(180deg)}
.ampel button{min-height:48px;white-space:nowrap;padding:0 6px}
details.lz summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
details.lz summary::-webkit-details-marker{display:none}
details.lz[open]>summary .pfeil{transform:rotate(180deg)}
details.lz summary .pfeil{transition:transform .2s;font-size:20px}
.knopf:disabled{background:#D5DAE3;color:#5B6478;cursor:default}
@media (max-width:600px){.knopf.breit{align-self:stretch!important;width:100%;min-height:52px}}

.schritte{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.schritte li{background:#fff;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:15px;line-height:1.3}
.schritte b{flex:none;width:28px;height:28px;border-radius:99px;background:var(--sonne);display:flex;align-items:center;justify-content:center}
.teaser-box{gap:12px}
.zurueck{background:#fff;border-bottom:3px solid var(--linie)}
.zurueck .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.zurueck-knopf{min-height:44px;padding:0 16px}
.zurueck-titel{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nur-schmal-inline{display:none}
@media (max-width:900px){.zurueck{position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(15,27,51,.08)}.nur-breit-inline{display:none}.nur-schmal-inline{display:inline}}
.knopf.klein{min-height:44px;padding:0 14px;font-size:15px;letter-spacing:0;white-space:nowrap}

.zurueck-knopf{min-height:48px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;line-height:44px}
body:has(.laeuft) .zurueck{display:none}
.text-knopf{min-height:44px;padding:0 8px;border:0;background:none;color:var(--tinte);opacity:.7;font:700 15px var(--text);cursor:pointer;white-space:nowrap;letter-spacing:0}
.text-knopf:hover{opacity:1;text-decoration:underline}
.teaser-karte{position:relative}
.teaser-frage{border-radius:22px;padding:24px;color:#fff;font:700 clamp(22px,3vw,28px)/1.3 var(--titel)}
.teaser-zaehler{font:800 clamp(36px,5vw,44px)/1 var(--titel)}
input::placeholder{color:#9AA3B5;letter-spacing:0;font-weight:400;text-transform:none}
.teaser-main>*{max-width:820px;width:100%}
.audio{display:flex;align-items:center;gap:14px;background:var(--flaeche);border-radius:16px;padding:10px 14px;max-width:560px}
.audio-play{flex:none;width:56px;height:56px;border-radius:99px;border:0;background:var(--thema,var(--blau));color:#fff;font:700 20px var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center}
.audio-balken{height:10px;border-radius:99px;background:#D5DAE3;cursor:pointer;overflow:hidden}
.audio-balken>div{height:100%;background:var(--thema,var(--blau));border-radius:99px}
.video{position:relative;aspect-ratio:16/9;max-width:640px;border-radius:14px;overflow:hidden;background:#0F1B33}
.video iframe,.video button{position:absolute;inset:0;width:100%;height:100%;border:0}
.video button{background-size:cover;background-position:center;cursor:pointer;display:flex;align-items:center;justify-content:center}
.video-play{width:76px;height:76px;border-radius:99px;background:var(--thema,var(--blau));color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.35);padding-left:6px}
.seite-inline{background:var(--sonne);color:var(--tinte);border-radius:8px;padding:1px 8px;font-weight:800;font-size:14px;align-self:flex-start}
.items:has(.laeuft) details.mehr,.items:has(.laeuft) details.lz{display:none}
.korrektur-leiste{display:flex;flex-wrap:wrap;gap:8px 18px;background:#fff;border-radius:14px;padding:10px 16px;font-size:15px}
.korrektur-leiste b{font-size:18px;margin-right:4px}
.pfeil-rechts{font:700 30px/1 var(--titel);color:var(--grau-2)}
a.kopf-text{text-decoration:none}a.kopf-text:hover{text-decoration:underline}
.video.eigen video{position:absolute;inset:0;width:100%;height:100%;background:#0F1B33}

/* Lehreransicht: alles offen, 🔒 zeigt, was für SuS gesperrt ist */
.lehrer-band{background:var(--tinte);color:#fff;font-size:15px}
.lehrer-band .wrap{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;align-items:center;padding-top:10px;padding-bottom:10px}
.lehrer-band a{color:#fff;font-weight:700}
.pill.gesperrt{background:#FFF1DC;color:#8A4104;border:2px solid #8A4104}
/* Lehrerseite */
.lz-titel{display:flex;align-items:center;gap:12px;font-size:26px;line-height:1.1}
.lz-nr{flex:none;width:36px;height:36px;border-radius:99px;background:var(--tinte);color:#fff;display:inline-flex;align-items:center;justify-content:center;font:800 18px var(--titel)}
.lz-zurueck{align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;font-weight:700;font-size:18px;color:var(--blau);text-decoration:none}
.lz-zurueck:hover{text-decoration:underline}
.lz-kopf{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:18px 20px;cursor:pointer;width:100%;border-radius:var(--radius-karte)}
.lz-kopf:focus-visible{outline:3px solid var(--blau);outline-offset:-3px}
.lz-chevron{flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--grau-2);transition:transform .2s}
.lz-kopf[aria-expanded=true] .lz-chevron{transform:rotate(180deg)}
.lz-inhalt{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--linie)}
.lz-block{display:flex;flex-direction:column;gap:12px;padding:18px 20px;border-bottom:1px solid var(--linie)}
.lz-block:last-child{border-bottom:0}
.lz-block h3{font-size:19px}
.lz-wahl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:8px}
.lz-wahl button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:44px;padding:12px 14px;border-radius:12px;border:2px solid var(--linie);background:#fff;color:var(--tinte);font:400 15px/1.3 var(--text);cursor:pointer}
.lz-wahl button b{font-size:17px}
.lz-wahl button:hover{border-color:var(--tinte)}
.lz-datum{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700}
.lz-zeile{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill.lz-offen{background:#E0F3F5;color:#07505B;border:2px solid #0A6E7D}
.lz-knoepfe{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:600px){.lz-knoepfe .knopf{width:100%}}
.lz-code{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:14px;border:2px solid var(--linie)}
.lz-feld{display:flex;flex-direction:column;gap:4px;font-weight:700;flex:1 1 200px}
.lz-fach{min-height:44px;padding:0 14px;border-radius:10px;border:2px solid var(--linie);background:#fff;color:var(--tinte);font:700 15px var(--text);cursor:pointer}
.lz-fach:hover{border-color:var(--tinte)}
.lz-themenwahl{display:flex;flex-direction:column;gap:8px;padding:4px 0 4px 14px;border-left:6px solid var(--linie)}
.lz-schritt{display:flex;align-items:center;gap:10px}
.lz-schritt .lz-nr{width:32px;height:32px;font-size:16px}
.lz-themenliste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lz-themenliste button{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 14px;border-radius:12px;border:2px solid var(--linie);background:#fff;color:var(--tinte);font:400 16px/1.25 var(--text);text-align:left;cursor:pointer}
.lz-themenliste button:hover{border-color:var(--tinte)}
.lz-box{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--grau-2);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.lz-pruefung{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;border:2px solid var(--linie)}
.lz-klassen-datum{display:flex;flex-direction:column;gap:8px;padding:10px 0 4px 14px;border-left:6px solid var(--linie)}
.lz-gruppe{display:flex;flex-direction:column;gap:12px}
.lz-schnell{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.lz-kachel{gap:6px}.lz-kachel b{font:700 22px/1.15 var(--titel)}.lz-emoji{font-size:30px;line-height:1}
.lz-klassenliste{display:flex;flex-direction:column;gap:8px}
.lz-klasse{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:12px 16px;min-height:64px;color:var(--tinte);text-decoration:none}
a.lz-klasse:hover{outline:3px solid var(--tinte)}
.lz-klasse-name{flex:none;min-width:56px;height:44px;padding:0 10px;border-radius:12px;background:var(--tinte);color:#fff;display:flex;align-items:center;justify-content:center;font:800 18px var(--titel)}
.lz-loesungen{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.lz-loesung{display:flex;flex-direction:column;gap:4px;align-items:flex-start;justify-content:center;min-height:56px;padding:12px 14px;border-radius:12px;border:2px solid var(--linie);background:#fff;color:var(--tinte);font:400 15px var(--text);cursor:pointer;text-align:left}
.lz-loesung:hover{border-color:var(--tinte)}
@media (max-width:600px){.lz-kachel{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:2px;align-items:center;padding:16px 18px}.lz-kachel .lz-emoji{grid-row:span 2}.lz-kachel b{font-size:20px}}

.nur-schmal{display:none!important}
@media (max-width:900px){.nur-schmal{display:inline-flex!important}}
