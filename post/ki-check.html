<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KI im Arbeitsalltag – Prototyp</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#15283A;--muted:#566778;--paper:#F3F5F7;--white:#fff;--line:#D6DDE4;--signal:#F4C542;--ok:#1D6234;--ok-bg:#DDEFE2;--mid:#6A5310;--mid-bg:#FBEFC8;--bad:#9B2C2C;--bad-bg:#F8E1E1}
*{box-sizing:border-box}
body{margin:0;font-family:"Source Sans 3",system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:18px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 32px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 18px;font-size:16px}
.count{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
.card{background:var(--white);border-radius:16px;padding:24px;box-shadow:0 1px 2px rgba(21,40,58,.06),0 8px 24px rgba(21,40,58,.08)}
.case{font-size:20px;font-weight:600;margin:0 0 18px;outline:none}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
button{font:inherit}
.opt{padding:14px 12px;border-radius:10px;border:2px solid var(--line);background:var(--white);color:var(--ink);cursor:pointer;font-weight:700;text-align:center}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:2px}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--ink)}}
.opt:disabled{cursor:default;color:var(--ink)}
.opt:disabled:not(.ok):not(.bad){opacity:.5}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt.ok small,.opt.bad small{color:inherit}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:17px;background:var(--paper)}
.fb:empty{display:none}
.fb b{display:block;margin-bottom:4px}
.btn{margin-top:14px;padding:11px 18px;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:700;cursor:pointer}
.note{margin-top:16px;font-size:14px;color:var(--muted)}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.badge{display:flex;gap:16px;align-items:center;background:var(--paper);border-radius:12px;padding:16px;margin:0 0 16px}.badge span{flex:none;width:64px;height:64px;border-radius:50%;background:var(--signal);display:grid;place-items:center;font:700 22px "Bricolage Grotesque",sans-serif;box-shadow:inset 0 0 0 4px #fff,0 0 0 2px var(--signal)}.badge b{display:block}
.embed h1,.embed .sub,.embed .note{display:none}
.embed .wrap{padding-top:16px;padding-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>KI im Arbeitsalltag</h1>
  <p class="sub">Prototyp: Darf ich hier KI nutzen? Acht Situationen aus dem Büroalltag, jeweils mit kurzer Begründung. Am Schluss gibt es einen Badge.</p>
  <div class="card" id="card" aria-live="polite"></div>
  <p class="note">Unabhängiger Prototyp mit Beispielinhalt, nicht von der Post. Die verbindlichen Regeln kämen aus den internen Richtlinien.</p>
</div>
<script>
(function(){
  if(location.search.indexOf('embed')>-1)document.documentElement.classList.add('embed');
  var C=[
    ["Du lässt dir von einem KI-Chat erklären, wie eine Excel-Formel funktioniert. Eigene Daten kopierst du nicht hinein.","ja","Gute Nutzung. Du lernst die Formel kennen und setzt sie danach selbst ein."],
    ["Eine Kundin beschwert sich per Mail. Du kopierst die Mail mit Name und Adresse in einen öffentlichen KI-Chat und lässt eine Antwort schreiben.","nein","Personendaten gehören nie in ein öffentliches KI-Werkzeug. Mit einem freigegebenen Werkzeug und ohne Namen sähe es anders aus."],
    ["Du lässt ein internes Konzeptpapier vom KI-Werkzeug zusammenfassen, das deine Firma freigegeben hat.","teil","Das freigegebene Werkzeug ist der richtige Ort. Prüf aber zuerst, wie vertraulich das Papier eingestuft ist. Im Zweifel fragst du nach."],
    ["Die KI hat dir eine Antwort an einen Kunden geschrieben. Sie klingt gut, also schickst du sie gleich ab.","nein","Du bleibst verantwortlich für jede Antwort. Lies sie durch und prüf die Fakten, bevor sie rausgeht."],
    ["Vor einer Weiterbildung lässt du dir von der KI zehn Übungsfragen zum Thema stellen.","ja","Sehr gut. Als Übungspartnerin hilft die KI beim Lernen. Prüf trotzdem die Antworten, auch KI macht Fehler."],
    ["Die KI nennt dir eine Gebühr, und du gibst sie einer Kundin am Telefon so weiter.","nein","KI kann Zahlen erfinden. Preise und Regeln nimmst du aus den offiziellen Quellen."],
    ["Aus deinen Stichworten lässt du einen Entwurf für die Präsentation im Teammeeting erstellen und überarbeitest ihn danach.","ja","In Ordnung. Die KI liefert den ersten Entwurf, Inhalt und Aussage bleiben deine."],
    ["Du findest ein neues KI-Tool im Internet, das niemand geprüft hat, und lädst eine Liste mit Kundendaten hoch.","nein","Ungeprüfte Tools und Kundendaten passen nie zusammen. Neue Tools lässt du zuerst von der zuständigen Stelle prüfen."]
  ];
  var L={ja:["Ja","passt so"],teil:["Mit Vorsicht","nur unter Bedingungen"],nein:["Nein","so nicht"]};
  var i=0,score=0,card=document.getElementById('card');
  function later(id){setTimeout(function(){var el=document.getElementById(id);if(el)el.focus()},0)}
  function show(focus){
    if(i>=C.length){card.innerHTML='<div class="count">Auswertung</div><p class="case" id="cs" tabindex="-1">'+score+' von '+C.length+' Situationen richtig eingeschätzt.</p>'+(score>=6?'<div class="badge"><span>KI</span><div><b>Badge «KI im Arbeitsalltag»</b>In echt würde er als digitaler Badge im Lernprofil erscheinen.</div></div>':'<p>Ab sechs richtigen Antworten gibt es den Badge. Versuch es nochmals.</p>')+'<p>In einer echten Einheit folgt danach ein Austausch im Team: Wo hilft uns KI, wo lassen wir es?</p><button class="btn" id="re">Nochmals</button>';document.getElementById('re').onclick=function(){i=0;score=0;show(true)};later('cs');post();return}
    var c=C[i];
    card.innerHTML='<div class="count">Situation '+(i+1)+' von '+C.length+'</div><p class="case" id="cs" tabindex="-1">'+c[0]+'</p><div class="opts">'+['ja','teil','nein'].map(function(k){return '<button class="opt" data-k="'+k+'">'+L[k][0]+'<small>'+L[k][1]+'</small></button>'}).join('')+'</div><div class="fb" id="fb"></div>';
    [].forEach.call(card.querySelectorAll('.opt'),function(b){b.onclick=function(){
      var ok=b.dataset.k===c[1];if(ok)score++;
      [].forEach.call(card.querySelectorAll('.opt'),function(x){x.disabled=true;if(x.dataset.k===c[1])x.classList.add('ok')});
      if(!ok)b.classList.add('bad');
      document.getElementById('fb').innerHTML='<b>'+(ok?'Richtig eingeschätzt.':'Besser: '+L[c[1]][0]+'.')+'</b>'+c[2]+'<br><button class="btn" id="nx">Weiter</button>';
      var t0=Date.now();document.getElementById('nx').onclick=function(){if(Date.now()-t0<450)return;i++;show(true)};later('nx');post();
    }});
    if(focus)later('cs');post();
  }
  function post(){try{parent.postMessage({protoH:Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height)},'*')}catch(e){}}
  if(window.ResizeObserver)new ResizeObserver(post).observe(document.body);
  show(false);
})();
</script>
</body>
</html>
